<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fridge</title>
    <meta name="description" content="A little surprise" />
    <link rel="preload" as="video" href="fridge.mp4" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="confetti-layer"></canvas>

    <button id="music-btn" class="music-btn" type="button" aria-label="Toggle music" aria-pressed="true">
      <svg id="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      <svg id="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle><line x1="3" y1="3" x2="21" y2="21"></line></svg>
    </button>

    <section id="intro" class="overlay intro">
      <video id="video" src="fridge.mp4" playsinline preload="auto"></video>
      <div id="hint" class="hint">Tap the door to open</div>
    </section>

    <main id="gallery" class="gallery">
      <div class="dance-banner">
        <video id="dance-video" class="dance-video" src="dance.mp4" muted loop playsinline preload="auto"></video>
        <div class="dance-overlay">
          <h2 class="dance-title">Happy Bday Mr Adolf</h2>
          <p class="dance-tagline">Put on your dancing shoes — the party starts now! 🎉</p>
          <p class="dance-fun">May your cake be big, your moves be fresh, and your year be lit! 🕺✨</p>
        </div>
      </div>

      <div class="img-wrap">
        <img src="4.png" alt="" loading="lazy" />
      </div>
      <div class="img-wrap">
        <img src="3.png" alt="" loading="lazy" />
      </div>
      <div class="img-wrap">
        <img src="2.png" alt="" loading="lazy" />
      </div>
      <div class="img-wrap">
        <img src="1.png" alt="" loading="lazy" />
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
